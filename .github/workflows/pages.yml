name: Publish Sandlab

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.changes.outputs.site_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect game changes
        id: changes
        run: node scripts/site-changed.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test simulation and preset worlds
        run: npm test
      - name: Build static game
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run build
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.site_changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.site_changed == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
