<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1530" viewBox="0 0 1620 1530" role="img" aria-labelledby="title desc">
<title id="title">Sandlab component architecture</title><desc id="desc">Browser inputs and compiled definitions feed typed World state. Fixed-order solvers calculate physics, heat, air, electricity, chemistry, biology, acoustics and optics. Read-only presentation draws common pixels and plays audio. History and persistence preserve authoritative state.</desc>
