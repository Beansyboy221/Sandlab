<text x="60" y="392" class="body">Undo / redo · autosave · local saves</text>
<text x="60" y="419" class="body">Import / export · validation / migration</text>
<text x="60" y="446" class="body">Stores authoritative state; excludes caches</text>
<rect x="500" y="315" width="620" height="153" rx="12" fill="#1b2a34" stroke="#e1bd74" stroke-opacity=".7"/>
