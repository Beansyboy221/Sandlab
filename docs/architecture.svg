<text x="1180" y="192" class="body">Fixed simulation ticks · 60 Hz cap</text>
<text x="1180" y="219" class="body">Render cadence · pause / step / speed</text>
<text x="1180" y="246" class="body">frame-clock.js · app.js</text>
